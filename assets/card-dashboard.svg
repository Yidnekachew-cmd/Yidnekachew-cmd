    <text x="116" y="38.5" font-size="14" fill="#869199">Built with Claude Code</text>
    <text x="24" y="88" font-size="28" font-weight="800" fill="#ffffff">QA Dashboard</text>
    <text x="24" y="124" font-size="17" fill="#c9d3d6">Test progress from the team's sheets,</text>
